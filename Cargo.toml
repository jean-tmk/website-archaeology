[package]
name = "website-archaeology"
version = "1.0.0"
edition = "2021"
description = "A digital stratigraphy engine for excavating forgotten interface eras"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "0.2"

[profile.release]
lto = true
opt-level = "s"
strip = true
